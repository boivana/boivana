<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana | Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#1B5E20,#2E7D32,#66BB6A);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:320px;
height:320px;

border-radius:50%;

background:rgba(255,255,255,.08);

top:-80px;
left:-80px;

}

body::after{

content:"";

position:absolute;

width:250px;
height:250px;

border-radius:50%;

background:rgba(255,255,255,.08);

bottom:-70px;
right:-70px;

}

.register-card{

width:90%;
max-width:430px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.25);

border-radius:25px;

padding:40px 30px;

text-align:center;

box-shadow:0 20px 45px rgba(0,0,0,.25);

position:relative;

z-index:1;

}

.logo{

width:90px;
height:90px;

background:#fff;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-size:45px;

margin:auto;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

h2{

color:#fff;

margin-top:20px;

font-size:30px;

}

.subtitle{

color:#E8F5E9;

margin:10px 0 30px;

}

.input-box{

margin-bottom:18px;

}

.input-box input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

background:rgba(255,255,255,.92);

}

.input-box input:focus{

outline:none;

box-shadow:0 0 0 3px rgba(255,255,255,.35);

}

.register-btn{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#FFD54F;

color:#222;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.register-btn:hover{

transform:translateY(-2px);

background:#FFCA28;

}

.extra{

margin-top:22px;

color:#fff;

}

.extra a{

color:#FFD54F;

text-decoration:none;

font-weight:bold;

}

.footer{

margin-top:25px;

color:#E8F5E9;

font-size:13px;

}

</style>

</head>

<body>

<div class="register-card">

<div class="logo">

📚

</div>

<h2>Join Boivana</h2>

<p class="subtitle">

Create your account and start your reading journey.

</p>

<div class="input-box">

<input
type="email"
id="email"
placeholder="📧 Email Address"
required>

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="🔒 Password"
required>

</div>

<button
class="register-btn"
onclick="registerUser()">

Create Account

</button>

<div class="extra">

Already have an account?

<br><br>

<a href="login.html">

Login Here

</a>

</div>

<div class="footer">

© 2026 Boivana • Read • Learn • Grow

</div>

</div>

<script type="module" src="assets/js/auth.js"></script>

</body>

</html>
