<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana Checkout</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>
<script type="module" src="assets/js/auth-guard.js"></script>

<body>


<header>

<h2>📚 Boivana Checkout</h2>

<a href="cart.html">← Back to Cart</a>

</header>




<section class="cart-section">


<h1>Checkout</h1>


<div id="checkout-items"></div>



<h2>
Total: ৳ <span id="checkout-total">0</span>
</h2>




<form id="order-form">


<input 
type="text"
id="name"
placeholder="Your Name"
required>


<br><br>


<input 
type="number"
id="phone"
placeholder="Phone Number"
required>


<br><br>



<textarea 
id="address"
placeholder="Delivery Address"
required></textarea>


<br><br>



<select id="payment">

<option value="Cash on Delivery">
Cash on Delivery
</option>


<option value="bKash">
bKash
</option>


</select>



<br><br>



<button type="submit">
Place Order
</button>



</form>


</section>



<script type="module" src="assets/js/auth.js"></script>

<script type="module" src="assets/js/checkout.js"></script>

</body>

</html>
