<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana | Checkout</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
}

header{

background:#2E7D32;
color:#fff;

padding:18px 8%;

display:flex;
justify-content:space-between;
align-items:center;

}

header a{

color:#fff;
text-decoration:none;

}

.container{

max-width:1200px;

margin:40px auto;

padding:20px;

display:grid;

grid-template-columns:2fr 1fr;

gap:30px;

}

.checkout-card,
.summary-card{

background:#fff;

padding:25px;

border-radius:18px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.checkout-card h2,
.summary-card h2{

color:#2E7D32;

margin-bottom:20px;

}

input,
textarea,
select{

width:100%;

padding:14px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}

textarea{

height:100px;

resize:none;

}

#checkout-items{

display:flex;

flex-direction:column;

gap:15px;

margin-bottom:20px;

}

.cart-card{

display:flex;

gap:15px;

align-items:center;

padding:10px;

border-bottom:1px solid #eee;

}

.cart-card img{

width:70px;

height:100px;

object-fit:cover;

border-radius:8px;

}

.total{

display:flex;

justify-content:space-between;

font-size:22px;

font-weight:bold;

margin:20px 0;

color:#2E7D32;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#2E7D32;

color:#fff;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1B5E20;

}

.secure{

margin-top:20px;

padding:15px;

background:#E8F5E9;

border-radius:10px;

text-align:center;

color:#2E7D32;

}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<h2>💳 Secure Checkout</h2>

<a href="cart.html">← Back to Cart</a>

</header>

<div class="container">

<div class="checkout-card">

<h2>Customer Information</h2>

<form id="order-form">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<textarea
id="address"
placeholder="Delivery Address"
required></textarea>

<select id="payment">

<option>Cash on Delivery</option>

<option>bKash</option>

<option>Nagad</option>

<option>Rocket</option>

</select>

<button type="submit">

Place Order

</button>

</form>

</div>

<div class="summary-card">

<h2>Order Summary</h2>

<div id="checkout-items">

<hr style="margin:20px 0;">

<div class="price-row">
    <span>Subtotal</span>
    <span>৳ <span id="subtotal">0</span></span>
</div>

<div class="price-row">
    <span>Delivery Charge</span>
    <span>৳ <span id="delivery-charge">60</span></span>
</div>

<div class="price-row total-row">
    <strong>Grand Total</strong>
    <strong>৳ <span id="checkout-total">0</span></strong>
</div>

<input
type="text"
id="coupon"
placeholder="🎟 Enter Coupon Code">

<button
type="button"
id="apply-coupon"
class="coupon-btn">

Apply Coupon

</button>

</div>

<div class="total">

<span>Total</span>

<span>
৳
<span id="checkout-total">
0
</span>
</span>

</div>

<div class="secure">

🔒 Secure Checkout

<br><br>

🚚 Delivery: 2–4 Days

</div>

</div>

</div>

<script type="module" src="assets/js/checkout.js"></script>

</body>

</html>
