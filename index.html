<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana | Online Book Store</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#F8F5EE;
    color:#222;
}


/* Header */

header{

    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 8%;

    background:#2E7D32;
    color:white;

}


.logo{

    font-size:28px;
    font-weight:bold;

}


nav a{

    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;

}


#cart-count{

    background:#FFD54F;
    color:#222;

    padding:3px 8px;

    border-radius:20px;

}


/* Hero */


.hero{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:70px 8%;

    background:
    linear-gradient(135deg,#2E7D32,#66BB6A);

    color:white;

}


.hero h1{

    font-size:50px;
    line-height:1.2;

}


.hero p{

    margin:20px 0;
    font-size:18px;

}


.hero button{

    padding:14px 30px;

    border:none;

    border-radius:10px;

    background:#FFD54F;

    font-weight:bold;

    cursor:pointer;

}


.book-icon{

    font-size:160px;

}



/* Books */


.section-title{

    text-align:center;

    margin:50px 0 30px;

    color:#2E7D32;

}


.books{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:25px;

    padding:0 8% 50px;

}


.book{

    background:white;

    padding:20px;

    border-radius:18px;

    text-align:center;

    box-shadow:0 8px 20px rgba(0,0,0,.1);

    transition:.3s;

}


.book:hover{

    transform:translateY(-8px);

}


.book img{

    width:140px;

    height:200px;

    object-fit:cover;

    border-radius:10px;

}


.book h3{

    margin:15px 0;

}


.book p{

    color:#2E7D32;

    font-weight:bold;

}


.buy-btn{

    width:100%;

    padding:12px;

    margin-top:15px;

    border:none;

    border-radius:10px;

    background:#2E7D32;

    color:white;

    cursor:pointer;

}



/* Footer */


footer{

    background:#1B5E20;

    color:white;

    text-align:center;

    padding:25px;

}


/* Mobile */

@media(max-width:768px){

header{

    flex-direction:column;
    gap:15px;

}


.hero{

    flex-direction:column;
    text-align:center;

}


.hero h1{

    font-size:35px;

}


.book-icon{

    font-size:100px;

}

}


</style>

</head>


<body>


<header>


<div class="logo">
📚 Boivana
</div>


<nav>

<a href="index.html">
Home
</a>


<a href="#books">
Books
</a>


<a href="cart.html">
🛒 Cart
<span id="cart-count">0</span>
</a>


<a href="login.html">
👤 Account
</a>


</nav>


</header>




<section class="hero">


<div>

<h1>

Read More.
<br>
Learn More.
<br>
Grow More.

</h1>


<p>

Discover your favourite books
at Boivana.

</p>


<button onclick="location.href='#books'">

Explore Books

</button>


</div>


<div class="book-icon">

📚

</div>


</section>




<section id="books">


<h2 class="section-title">

Featured Books

</h2>


<div class="books" id="book-container">


</div>


</section>




<footer>

<p>

© 2026 Boivana

<br>

Read • Learn • Grow

</p>

</footer>




<script type="module" src="assets/js/auth-guard.js"></script>

<script type="module" src="assets/js/script.js"></script>


</body>

</html>
