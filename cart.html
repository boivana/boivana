<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana | Shopping Cart</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F5F7FA;
color:#222;
}

/* Header */

header{

background:#2E7D32;
color:#fff;

padding:18px 8%;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}

header h2{

font-size:28px;

}

header a{

text-decoration:none;

color:#fff;

background:rgba(255,255,255,.15);

padding:10px 18px;

border-radius:10px;

transition:.3s;

}

header a:hover{

background:#fff;

color:#2E7D32;

}


/* Layout */

.cart-container{

max-width:1200px;

margin:40px auto;

padding:0 20px;

display:grid;

grid-template-columns:2fr 1fr;

gap:30px;

}


/* Left */

.cart-left{

background:#fff;

padding:25px;

border-radius:18px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.cart-left h1{

margin-bottom:20px;

color:#2E7D32;

}


/* Cart Items */

#cart-items{

display:flex;

flex-direction:column;

gap:20px;

}


/* Right */

.cart-right{

background:#fff;

padding:25px;

border-radius:18px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

height:max-content;

position:sticky;

top:25px;

}

.cart-right h2{

margin-bottom:20px;

color:#2E7D32;

}

.summary{

display:flex;

justify-content:space-between;

margin:15px 0;

font-size:17px;

}

.total{

font-size:24px;

font-weight:bold;

color:#2E7D32;

}

#checkout-btn{

width:100%;

padding:15px;

margin-top:25px;

border:none;

border-radius:12px;

background:#2E7D32;

color:#fff;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

#checkout-btn:hover{

background:#1B5E20;

transform:translateY(-2px);

}

.note{

margin-top:20px;

padding:15px;

background:#E8F5E9;

border-radius:10px;

color:#2E7D32;

font-size:14px;

text-align:center;

}


/* Responsive */

@media(max-width:900px){

.cart-container{

grid-template-columns:1fr;

}

.cart-right{

position:static;

}

}

</style>

</head>

<body>

<header>

<h2>🛒 Boivana Cart</h2>

<a href="index.html">
← Continue Shopping
</a>

</header>

<div class="cart-container">

<div class="cart-left">

<h1>Your Shopping Cart</h1>

<div id="cart-items">

<!-- Books will appear here -->

</div>

</div>


<div class="cart-right">

<h2>Order Summary</h2>

<div class="summary">

<span>Items</span>

<span id="cart-count">0</span>

</div>

<hr>

<div class="summary total">

<span>Total</span>

<span>৳ <span id="total-price">0</span></span>

</div>

<button id="checkout-btn">

Proceed to Checkout

</button>

<div class="note">

📚 Thank you for choosing Boivana.<br>
Happy Reading ❤️

</div>

</div>

</div>

<script>

document
.getElementById("checkout-btn")
.addEventListener("click",function(){

window.location.href="checkout.html";

});

</script>

<script type="module" src="assets/js/auth.js"></script>

<script type="module" src="assets/js/auth-guard.js"></script>

<script type="module" src="assets/js/script.js"></script>

</body>

</html>
