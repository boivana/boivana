<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boivana Cart</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1a1c29, #0d0e15);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    header h2 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header a {
      color: #a78bfa;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    header a:hover {
      text-decoration: underline;
    }

    .cart-section {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cart-section h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    /* Cart Item Card Styling */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cart-item-info h4 {
      font-size: 1rem;
      color: #f3f4f6;
    }

    .cart-item-info p {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .empty-cart {
      text-align: center;
      color: #9ca3af;
      padding: 20px 0;
    }

    .total-container {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
    }

    #checkout-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 125, 50, 0.4);
    }
  </style>
</head>

<body>

  <header>
    <h2>🛒 Boivana Cart</h2>
    <a href="index.html">← Continue Shopping</a>
  </header>

  <section class="cart-section">
    <h1>Your Cart</h1>

    <!-- Cart items logic JS diye render hobe -->
    <div id="cart-items"></div>

    <div class="total-container">
      <h3>Total:</h3>
      <h2>৳ <span id="total-price">0</span></h2>
    </div>

    <button id="checkout-btn">Proceed to Checkout</button>
  </section>

  <script>
    // LocalStorage theke cart data load korar logic
    function displayCart() {
      const cartContainer = document.getElementById("cart-items");
      const totalPriceElement = document.getElementById("total-price");
      
      // LocalStorage theke data nilam (Jodi thake)
      const cart = JSON.parse(localStorage.getItem("cart")) || [];

      if (cart.length === 0) {
        cartContainer.innerHTML = `<p class="empty-cart">Your cart is currently empty!</p>`;
        totalPriceElement.innerText = "0";
        return;
      }

      let total = 0;
      cartContainer.innerHTML = "";

      cart.forEach((item, index) => {
        total += Number(item.price);
        cartContainer.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.title}</h4>
              <p>৳ ${item.price}</p>
            </div>
            <button onclick="removeItem(${index})" style="background:transparent; border:none; color:#ef4444; cursor:pointer;">Remove</button>
          </div>
        `;
      });

      totalPriceElement.innerText = total;
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      displayCart();
    }

    // Page load hone call korbe
    document.addEventListener("DOMContentLoaded", displayCart);

    const checkoutBtn = document.querySelector("#checkout-btn");
    if (checkoutBtn) {
      checkoutBtn.addEventListener("click", () => {
        window.location.href = "checkout.html";
      });
    }
  </script>

  <script type="module" src="assets/js/auth.js"></script>
  <script type="module" src="assets/js/auth-guard.js"></script>
  <script type="module" src="assets/js/script.js"></script>

</body>

</html>
