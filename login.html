<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boivana | Login</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1B5E20,#2E7D32,#4CAF50);
    padding:20px;
}

.login-card{

    width:100%;
    max-width:420px;

    background:#ffffff;

    border-radius:20px;

    padding:35px;

    box-shadow:0 15px 40px rgba(0,0,0,.2);

    text-align:center;

}

.logo{

    width:90px;
    height:90px;

    margin:auto;

    border-radius:50%;

    background:#2E7D32;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;

    font-size:40px;

}

h1{

    margin:20px 0 10px;

    color:#2E7D32;

}

p{

    color:#666;

    margin-bottom:25px;

}

.input-group{

    margin-bottom:18px;

}

.input-group input{

    width:100%;

    padding:15px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;

}

.input-group input:focus{

    outline:none;

    border-color:#2E7D32;

}

.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#2E7D32;

    color:#fff;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.login-btn:hover{

    background:#1B5E20;

}

.register{

    margin-top:20px;

}

.register a{

    color:#2E7D32;

    text-decoration:none;

    font-weight:bold;

}

.footer{

    margin-top:25px;

    color:#888;

    font-size:13px;

}

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">📚</div>

    <h1>Welcome to Boivana</h1>

    <p>Login to access your account.</p>

    <div class="input-group">

        <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

    </div>

    <div class="input-group">

        <input
        type="password"
        id="password"
        placeholder="Password"
        required>

    </div>

    <button
    class="login-btn"
    onclick="loginUser()">

        Login

    </button>

    <div class="register">

        Don't have an account?

        <br><br>

        <a href="register.html">

            Create Account

        </a>

    </div>

    <div class="footer">

        © 2026 Boivana

    </div>

</div>

<script type="module" src="assets/js/auth.js"></script>

</body>

</html>
