<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana | Register</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f6f5ef;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.register-box{
    width:90%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:40px;
}

h2{
    text-align:center;
    color:#2E7D32;
    margin:15px 0;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2E7D32;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#2E7D32;
    color:#fff;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#256428;
}

.bottom{
    text-align:center;
    margin-top:20px;
}

.bottom a{
    color:#2E7D32;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">📚</div>

<h2>Create Your Account</h2>

<p>Join Boivana and discover your next favourite book.</p>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password (Minimum 6 characters)">

<button onclick="registerUser()">
Create Account
</button>

<div class="bottom">

Already have an account?

<br><br>

<a href="login.html">
Login Now
</a>

</div>

</div>

<script type="module" src="assets/js/auth.js"></script>

</body>
</html>
