<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana | Login</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,#1B5E20,#2E7D32,#66BB6A);

    overflow:hidden;

}

body::before{

    content:"";

    position:absolute;

    width:320px;
    height:320px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    top:-80px;
    left:-80px;

}

body::after{

    content:"";

    position:absolute;

    width:250px;
    height:250px;

    border-radius:50%;

    background:rgba(255,255,255,.08);

    bottom:-70px;
    right:-70px;

}

.login-card{

    position:relative;

    width:90%;
    max-width:420px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:24px;

    padding:40px 30px;

    box-shadow:0 20px 45px rgba(0,0,0,.25);

    text-align:center;

}

.logo{

    width:90px;
    height:90px;

    margin:auto;

    border-radius:50%;

    background:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:45px;

    box-shadow:0 10px 25px rgba(0,0,0,.2);

}

h2{

    color:#fff;

    margin-top:20px;

    font-size:30px;

}

.subtitle{

    color:#E8F5E9;

    margin:10px 0 30px;

    font-size:15px;

}

.input-box{

    margin-bottom:18px;

}

.input-box input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:rgba(255,255,255,.9);

    font-size:16px;

}

.input-box input:focus{

    outline:none;

    box-shadow:0 0 0 3px rgba(255,255,255,.35);

}

.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#FFD54F;

    color:#222;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-2px);

}

.extra{

    margin-top:22px;

    color:#fff;

    font-size:15px;

}

.extra a{

    color:#FFD54F;

    text-decoration:none;

    font-weight:bold;

}

.footer{

    margin-top:25px;

    color:#E8F5E9;

    font-size:13px;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
📚
</div>

<h2>Boivana</h2>

<p class="subtitle">
Welcome Back! Sign in to continue your reading journey.
</p>

<div class="input-box">

<input
type="email"
id="email"
placeholder="📧 Email Address">

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="🔒 Password">

</div>

<button
class="login-btn"
onclick="loginUser()">

Login

</button>

<div class="extra">

Don't have an account?

<br><br>

<a href="register.html">
Create Account
</a>

</div>

<div class="footer">

© 2026 Boivana • Read More, Learn More

</div>

</div>

<script type="module" src="assets/js/auth.js"></script>

</body>

</html>
