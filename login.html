<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana Login</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1B5E20,#4CAF50);
font-family:Arial,sans-serif;

}


.login-box{

width:90%;
max-width:400px;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

text-align:center;

}


.logo{

font-size:55px;

}


h1{

color:#2E7D32;

margin:15px 0;

}


input{

width:100%;

padding:14px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}


button{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:10px;

background:#2E7D32;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}


button:hover{

background:#1B5E20;

}


a{

color:#2E7D32;

font-weight:bold;

text-decoration:none;

}


</style>

</head>


<body>


<div class="login-box">


<div class="logo">
📚
</div>


<h1>
Boivana
</h1>


<p>
Login to continue reading
</p>


<input 
type="email"
id="email"
placeholder="Email Address">


<input
type="password"
id="password"
placeholder="Password">


<button onclick="loginUser()">

Login

</button>


<br><br>


<p>
Don't have account?
<a href="register.html">
Register
</a>
</p>


</div>



<script type="module" src="assets/js/auth.js"></script>


</body>

</html>
