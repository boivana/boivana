<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boivana Admin Dashboard</title>

<link rel="stylesheet" href="../assets/css/style.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f5f7fa;

color:#222;

}



/* Header */

header{

background:linear-gradient(135deg,#2E7D32,#1B5E20);

color:white;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}



header h2{

font-size:24px;

}


header a{

color:white;

text-decoration:none;

background:rgba(255,255,255,.15);

padding:10px 20px;

border-radius:10px;

}



/* Main */

.cart-section{

max-width:1200px;

margin:40px auto;

padding:20px;

}



.cart-section h1{

text-align:center;

color:#2E7D32;

margin-bottom:35px;

font-size:32px;

}



/* Cards */

.books{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:25px;

}



.cart-card,
.book{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

transition:.3s;

}



.cart-card:hover,
.book:hover{

transform:translateY(-5px);

box-shadow:0 15px 35px rgba(0,0,0,.12);

}



h3{

color:#2E7D32;

margin-bottom:20px;

font-size:21px;

}



p{

font-size:16px;

margin:12px 0;

color:#555;

}



/* Stats */

#total-orders,
#pending-orders,
#delivered-orders{

font-weight:bold;

color:#2E7D32;

font-size:20px;

}



/* Button */

button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#2E7D32;

color:white;

font-size:16px;

cursor:pointer;

margin-top:15px;

transition:.3s;

}



button:hover{

background:#1B5E20;

}



a{

text-decoration:none;

}



/* Mobile */

@media(max-width:600px){


header{

padding:18px;

}


header h2{

font-size:20px;

}


.cart-section{

padding:15px;

margin:20px auto;

}



.cart-section h1{

font-size:26px;

}


.cart-card,
.book{

padding:22px;

}


}



</style>

</head>


<body>



<header>

<h2>
📚 Boivana Admin
</h2>


<a href="orders.html">
🛒 Orders
</a>


</header>




<section class="cart-section">


<h1>
Admin Dashboard
</h1>




<div class="books">



<div class="cart-card">


<h3>
📊 Dashboard Stats
</h3>



<p>
Total Orders:
<span id="total-orders">0</span>
</p>


<p>
Pending Orders:
<span id="pending-orders">0</span>
</p>


<p>
Delivered Orders:
<span id="delivered-orders">0</span>
</p>



</div>





<div class="book">


<h3>
📚 Manage Books
</h3>


<p>
Add, Edit & Delete Books
</p>



<a href="books.html">

<button>

Manage Books

</button>

</a>


</div>





<div class="book">


<h3>
🛒 Manage Orders
</h3>



<p>
View and update customer orders
</p>



<a href="orders.html">

<button>

View Orders

</button>

</a>


</div>



</div>



</section>




<script type="module" src="dashboard.js"></script>


<script>


if(
localStorage.getItem("boivanaAdmin")
!=="true"
){

window.location.href="login.html";

}


</script>



</body>

</html>
